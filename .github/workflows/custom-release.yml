name: "Custom Build & Release"

on:
  push:
    branches:
      - 'bugfix/**'
      - 'feature/**'
      - 'release-custom'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    name: "Quality & Tests"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Build CLI helper (required by ai tests)
        run: cargo build -p craft-anything-cli
      - name: Run tests
        run: cargo test -p craft-anything-platform -p craft-anything-ai -p craft-anything-ui-egui
      - name: Layers and locks check
        run: |
          cargo xtask layers
          cargo xtask locks
          cargo xtask secrets

  macos:
    name: "macOS Universal Package"
    needs: [check]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Clone craft-fonts
        run: git clone --depth 1 https://github.com/storytold/craft-fonts.git "$GITHUB_WORKSPACE/craft-fonts"
      - name: Build and package macOS universal
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}/craft-fonts
        run: packaging/macos/package.sh --arch universal
      - name: Verify macOS package
        run: packaging/macos/verify.sh --arch universal
      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/release/*

  windows:
    name: "Windows x64 Package"
    needs: [check]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX toolset v5
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2 WixToolset.Util.wixext/5.0.2
      - name: Clone craft-fonts
        shell: pwsh
        run: git clone --depth 1 https://github.com/storytold/craft-fonts.git "$env:GITHUB_WORKSPACE\craft-fonts"
      - name: Build and package Windows x64
        shell: pwsh
        env:
          CRAFT_FONTS_DIR: ${{ github.workspace }}\craft-fonts
        run: pwsh packaging/windows/package.ps1 -Arch x64
      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/release/*

  release:
    name: "Publish GitHub Release"
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist/release
      - name: Download Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist/release
      - name: Resolve version
        id: get_version
        run: |
          VERSION=$(awk '/^\[workspace\.package\]/ { found=1; next } found && /^version =/ { gsub(/[" ]/, "", $3); print $3; exit }' Cargo.toml)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "TAG=v$VERSION" >> $GITHUB_ENV
      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: "Craft Anything ${{ env.TAG }}"
          body: |
            ## Craft Anything ${{ env.TAG }}
            
            ### Fixes & Improvements in this release:
            - **Antigravity Resiliency**: Fixed stream freeze and hang on API/TLS network errors (`tls: bad record MAC`); automatically classifies transient errors for seamless continuation via `--conversation`.
            - **Process Cleanup**: Enforced 3s post-result process group reaping and non-blocking process termination in `Supervisor`, eliminating hangs after stream error events.
            - **Pause & Resume Fix**: Added 2s stop timeout in rebuild worker loop and cleaned up `pausing` state in UI on run completion to prevent getting stuck in "Pausing…".
            - **Cross-Platform Releases**: Includes macOS Universal DMG / CLI and Windows x64 MSI / Portable ZIP packages.
          files: |
            dist/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
